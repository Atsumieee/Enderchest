<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2x2 Netz — Spielwiese</title>
<style>
  :root {
    --v1: #7400b8; --v2: #6930c3; --v3: #5e60ce; --c1: #56cfe1; --c2: #80ffdb;
    --bg: #fafaf9; --bg-surface: #f3f0fa; --bg-card: #ffffff;
    --text: #1a1025; --text-muted: #4a3d6b; --text-dim: #9b94b8;
    --border: rgba(116,0,184,0.10); --border-strong: rgba(116,0,184,0.20);
    --grid: rgba(116,0,184,0.07); --axis: rgba(116,0,184,0.25);
    --canvas-bg: #f3f0fa;
    --status-success: #36a35a;
    --shadow-md: 0 1px 2px rgba(26,16,37,0.04), 0 10px 26px -16px rgba(116,0,184,0.30);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --v2: #a78bfa; --v3: #5e60ce;
      --bg: #0d0b14; --bg-surface: #13101e; --bg-card: #1a1628;
      --text: #ede9ff; --text-muted: #9b94b8; --text-dim: #4a4460;
      --border: rgba(116,0,184,0.20); --border-strong: rgba(94,96,206,0.35);
      --grid: rgba(94,96,206,0.10); --axis: rgba(94,96,206,0.35);
      --canvas-bg: #100d1a;
    }
  }
  [data-theme="dark"] {
    --v2: #a78bfa; --v3: #5e60ce;
    --bg: #0d0b14; --bg-surface: #13101e; --bg-card: #1a1628;
    --text: #ede9ff; --text-muted: #9b94b8; --text-dim: #4a4460;
    --border: rgba(116,0,184,0.20); --border-strong: rgba(94,96,206,0.35);
    --grid: rgba(94,96,206,0.10); --axis: rgba(94,96,206,0.35);
    --canvas-bg: #100d1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 15px; line-height: 1.6; padding: 1.5rem;
    transition: background 0.15s, color 0.15s;
  }
  .widget {
    background: var(--bg-card); border: 1px solid var(--border-strong);
    border-radius: 12px; padding: 1.5rem; box-shadow: var(--shadow-md);
    max-width: 560px; margin: 0 auto;
  }
  .widget-label {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--v2); margin-bottom: 1rem;
  }
  canvas { display: block; width: 100%; border-radius: 6px; border: 1px solid var(--border); }
  .section-title {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-dim); margin: 1rem 0 0.5rem;
  }
  .slider-row { display: flex; align-items: center; gap: 0.75rem; margin-top: 0.4rem; }
  .slider-row label {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px; color: var(--text-muted); white-space: nowrap; min-width: 110px;
  }
  input[type="range"] { flex: 1; accent-color: var(--v2); height: 4px; cursor: pointer; }
  .val { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: 600; color: var(--v2); min-width: 34px; text-align: right; }
  .toggle-row { display: flex; gap: 0.5rem; margin-top: 1rem; }
  .toggle-btn {
    flex: 1; padding: 0.5rem; border-radius: 6px;
    border: 1px solid var(--border-strong); background: var(--bg-surface);
    color: var(--text-muted); font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.12s;
  }
  .toggle-btn:hover { opacity: 0.85; }
  .toggle-btn.active { background: linear-gradient(90deg, var(--v1), var(--v3)); color: #fff; border-color: transparent; }
  .threshold-row { margin-top: 0.75rem; }
  .threshold-row.hidden { display: none; }
</style>
</head>
<body>
<div class="widget">
  <div class="widget-label">Widget — 2x2 Netz Spielwiese</div>
  <canvas id="canvas" width="520" height="300"></canvas>

  <div class="section-title">Eingänge</div>
  <div class="slider-row">
    <label>Eingang 1</label>
    <input type="range" id="i1" min="0" max="1" step="0.05" value="1.0">
    <span class="val" id="i1v">1.00</span>
  </div>
  <div class="slider-row">
    <label>Eingang 2</label>
    <input type="range" id="i2" min="0" max="1" step="0.05" value="0.5">
    <span class="val" id="i2v">0.50</span>
  </div>

  <div class="section-title">Gewichte Neuron 1</div>
  <div class="slider-row">
    <label>w1 → Neuron 1</label>
    <input type="range" id="w11" min="0" max="1" step="0.05" value="0.9">
    <span class="val" id="w11v">0.90</span>
  </div>
  <div class="slider-row">
    <label>w2 → Neuron 1</label>
    <input type="range" id="w12" min="0" max="1" step="0.05" value="0.3">
    <span class="val" id="w12v">0.30</span>
  </div>

  <div class="section-title">Gewichte Neuron 2</div>
  <div class="slider-row">
    <label>w1 → Neuron 2</label>
    <input type="range" id="w21" min="0" max="1" step="0.05" value="0.2">
    <span class="val" id="w21v">0.20</span>
  </div>
  <div class="slider-row">
    <label>w2 → Neuron 2</label>
    <input type="range" id="w22" min="0" max="1" step="0.05" value="0.8">
    <span class="val" id="w22v">0.80</span>
  </div>

  <div class="toggle-row">
    <button class="toggle-btn active" data-act="stufe">Stufenfunktion</button>
    <button class="toggle-btn" data-act="sigmoid">Sigmoidfunktion</button>
  </div>

  <div class="threshold-row" id="threshRow">
    <div class="slider-row">
      <label>Schwelle</label>
      <input type="range" id="thresh" min="0" max="2" step="0.05" value="1.0">
      <span class="val" id="threshv">1.00</span>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  let state = {
    i1: 1.0, i2: 0.5,
    w11: 0.9, w12: 0.3,
    w21: 0.2, w22: 0.8,
    act: 'stufe', thresh: 1.0
  };

  function getCSSVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function sigmoid(s) { return 1 / (1 + Math.exp(-s)); }

  function compute() {
    const sum1 = state.i1 * state.w11 + state.i2 * state.w12;
    const sum2 = state.i1 * state.w21 + state.i2 * state.w22;
    let out1, out2;
    if (state.act === 'stufe') {
      out1 = sum1 >= state.thresh ? 1 : 0;
      out2 = sum2 >= state.thresh ? 1 : 0;
    } else {
      out1 = sigmoid(sum1);
      out2 = sigmoid(sum2);
    }
    return { sum1, sum2, out1, out2 };
  }

  function draw() {
    const r = compute();
    ctx.clearRect(0, 0, W, H);
    const bg = getCSSVar('--canvas-bg') || '#f3f0fa';
    const text = getCSSVar('--text') || '#1a1025';
    const muted = getCSSVar('--text-muted') || '#4a3d6b';
    const dim = getCSSVar('--text-dim') || '#9b94b8';
    const accent = getCSSVar('--v2') || '#6930c3';

    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    // Positionen
    const inX = 70;
    const neurX = 340;
    const in1Y = 90, in2Y = 210;
    const n1Y = 90, n2Y = 210;
    const R = 30;

    // Verbindungen mit Gewichten
    const conns = [
      { x1: inX, y1: in1Y, x2: neurX, y2: n1Y, w: state.w11 },
      { x1: inX, y1: in2Y, x2: neurX, y2: n1Y, w: state.w12 },
      { x1: inX, y1: in1Y, x2: neurX, y2: n2Y, w: state.w21 },
      { x1: inX, y1: in2Y, x2: neurX, y2: n2Y, w: state.w22 },
    ];
    conns.forEach(c => {
      ctx.strokeStyle = accent;
      ctx.globalAlpha = 0.25 + 0.6 * c.w;  // dickere/sichtbarere Linie bei grossem Gewicht
      ctx.lineWidth = 1 + 3 * c.w;
      ctx.beginPath(); ctx.moveTo(c.x1 + R, c.y1); ctx.lineTo(c.x2 - R, c.y2); ctx.stroke();
      ctx.globalAlpha = 1;
      // Gewicht-Label
      const mx = (c.x1 + c.x2) / 2, my = (c.y1 + c.y2) / 2;
      ctx.fillStyle = dim; ctx.font = '11px JetBrains Mono, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(c.w.toFixed(2), mx, my - 4);
    });

    // Eingänge
    function drawNode(x, y, fill, line1, line2) {
      ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2);
      ctx.fillStyle = fill; ctx.fill();
      ctx.strokeStyle = bg; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
      ctx.font = '600 13px JetBrains Mono, monospace';
      ctx.textBaseline = 'middle';
      if (line2) {
        ctx.fillText(line1, x, y - 7);
        ctx.font = '11px JetBrains Mono, monospace';
        ctx.fillText(line2, x, y + 8);
      } else {
        ctx.fillText(line1, x, y);
      }
      ctx.textBaseline = 'alphabetic';
    }

    drawNode(inX, in1Y, '#5e60ce', state.i1.toFixed(2));
    drawNode(inX, in2Y, '#5e60ce', state.i2.toFixed(2));

    // Neuronen mit Summe und Ausgabe
    const out1str = state.act === 'stufe' ? r.out1.toString() : r.out1.toFixed(2);
    const out2str = state.act === 'stufe' ? r.out2.toString() : r.out2.toFixed(2);
    drawNode(neurX, n1Y, '#6930c3', 'Σ ' + r.sum1.toFixed(2), '→ ' + out1str);
    drawNode(neurX, n2Y, '#6930c3', 'Σ ' + r.sum2.toFixed(2), '→ ' + out2str);

    // Labels
    ctx.fillStyle = muted; ctx.font = '12px DM Sans, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Eingang 1', inX, in1Y - R - 10);
    ctx.fillText('Eingang 2', inX, in2Y + R + 20);
    ctx.fillText('Neuron 1', neurX, n1Y - R - 10);
    ctx.fillText('Neuron 2', neurX, n2Y + R + 20);

    // Ausgabe-Pfeile und Werte rechts
    ctx.strokeStyle = dim; ctx.lineWidth = 2;
    [n1Y, n2Y].forEach((y, i) => {
      ctx.beginPath(); ctx.moveTo(neurX + R, y); ctx.lineTo(neurX + R + 60, y); ctx.stroke();
      // Pfeilspitze
      ctx.beginPath();
      ctx.moveTo(neurX + R + 60, y); ctx.lineTo(neurX + R + 52, y - 4); ctx.lineTo(neurX + R + 52, y + 4);
      ctx.closePath(); ctx.fillStyle = dim; ctx.fill();
      const ostr = i === 0 ? out1str : out2str;
      ctx.fillStyle = accent; ctx.font = '600 15px JetBrains Mono, monospace';
      ctx.textAlign = 'left';
      ctx.fillText(ostr, neurX + R + 68, y + 5);
    });

    // Funktionsname oben
    ctx.fillStyle = dim; ctx.font = '11px JetBrains Mono, monospace'; ctx.textAlign = 'right';
    const fname = state.act === 'stufe' ? 'Stufe (Schwelle ' + state.thresh.toFixed(2) + ')' : 'Sigmoid';
    ctx.fillText('Aktivierung: ' + fname, W - 12, 20);
  }

  function bindSlider(id, key) {
    const el = document.getElementById(id);
    const vEl = document.getElementById(id + 'v');
    el.addEventListener('input', () => {
      state[key] = parseFloat(el.value);
      vEl.textContent = state[key].toFixed(2);
      draw();
    });
  }
  bindSlider('i1', 'i1'); bindSlider('i2', 'i2');
  bindSlider('w11', 'w11'); bindSlider('w12', 'w12');
  bindSlider('w21', 'w21'); bindSlider('w22', 'w22');
  bindSlider('thresh', 'thresh');

  document.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.act = btn.dataset.act;
      document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('threshRow').className = state.act === 'stufe' ? 'threshold-row' : 'threshold-row hidden';
      draw();
    });
  });

  const observer = new MutationObserver(draw);
  observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class'] });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);

  draw();
</script>
</body>
</html>
