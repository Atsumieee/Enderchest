
<style>
.step-dots { display: flex; gap: 6px; margin-bottom: 20px; }
.step-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-border-secondary); transition: background 0.2s; cursor: pointer; }
.step-dot.active { background: #534AB7; }
.step-dot.done { background: #1D9E75; }
.step-panel { border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-lg); overflow: hidden; }
.step-head { padding: 14px 16px 12px; background: var(--color-background-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); display: flex; align-items: center; gap: 12px; }
.step-num { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; flex-shrink: 0; }
.step-title { font-size: 15px; font-weight: 500; color: var(--color-text-primary); }
.step-sub { font-size: 12px; color: var(--color-text-secondary); margin-top: 1px; }
.step-body { padding: 16px; }
.step-body p { font-size: 13px; color: var(--color-text-secondary); line-height: 1.65; margin: 0 0 12px; }
.pipeline-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.pipe-box { border-radius: var(--border-radius-md); padding: 8px 12px; font-family: var(--font-mono); font-size: 12px; border: 0.5px solid; }
.pipe-arrow { color: var(--color-text-tertiary); font-size: 16px; flex-shrink: 0; }
.warning-box { border-left: 2px solid #E24B4A; border-radius: 0; padding: 8px 12px; background: #FCEBEB; margin: 12px 0; }
.warning-box p { color: #791F1F; margin: 0; font-size: 13px; }
.warning-label { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: #A32D2D; margin-bottom: 3px; }
.good-box { border-left: 2px solid #1D9E75; border-radius: 0; padding: 8px 12px; background: #E1F5EE; margin: 12px 0; }
.good-box p { color: #085041; margin: 0; font-size: 13px; }
.good-label { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: #0F6E56; margin-bottom: 3px; }
.rt-table { width: 100%; border-collapse: collapse; font-size: 12px; font-family: var(--font-mono); margin: 10px 0; }
.rt-table th { text-align: left; padding: 5px 8px; background: var(--color-background-secondary); color: var(--color-text-tertiary); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 0.5px solid var(--color-border-secondary); font-family: var(--font-sans); font-weight: 500; }
.rt-table td { padding: 6px 8px; border-bottom: 0.5px solid var(--color-border-tertiary); color: var(--color-text-secondary); }
.rt-table td:first-child { color: var(--color-text-primary); }
.rt-table tr.highlight td { background: #FAEEDA; color: #633806; }
.rt-table tr:last-child td { border-bottom: none; }
.step-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
.nav-btn { font-size: 13px; padding: 7px 16px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-secondary); cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
.nav-btn:hover { border-color: var(--color-border-primary); color: var(--color-text-primary); }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.nav-btn.primary { background: #EEEDFE; border-color: #AFA9EC; color: #3C3489; }
.nav-btn.primary:hover { background: #CECBF6; }
.step-counter { font-size: 12px; color: var(--color-text-tertiary); font-family: var(--font-mono); }
</style>

<h2 class="sr-only">Hash-Pipeline Stepper: vom Passwort zum gespeicherten Hash mit Salt</h2>

<div class="step-dots" id="step-dots">
  <div class="step-dot active" onclick="goStep(0)"></div>
  <div class="step-dot" onclick="goStep(1)"></div>
  <div class="step-dot" onclick="goStep(2)"></div>
  <div class="step-dot" onclick="goStep(3)"></div>
  <div class="step-dot" onclick="goStep(4)"></div>
</div>

<div class="step-panel" id="step-container"></div>

<div class="step-nav">
  <button class="nav-btn" id="btn-prev" onclick="navigate(-1)" disabled><i class="ti ti-arrow-left" aria-hidden="true"></i> Zurück</button>
  <span class="step-counter" id="step-counter">1 / 5</span>
  <button class="nav-btn primary" id="btn-next" onclick="navigate(1)">Weiter <i class="ti ti-arrow-right" aria-hidden="true"></i></button>
</div>

<script>
var STEPS = [
  {
    num: 1, color: '#534AB7', bg: '#EEEDFE',
    title: 'Passwort eingegeben',
    sub: 'Der Nutzer gibt sein Passwort ein',
    content: function() { return '<p>Du gibst dein Passwort im Browser ein. Es wird im Klartext an den Server gesendet — deshalb ist HTTPS so wichtig, damit niemand den Datenstrom mitlesen kann.</p><div class="pipeline-row"><div class="pipe-box" style="background:#EEEDFE;color:#3C3489;border-color:#AFA9EC;">Pizza123</div><span class="pipe-arrow"><i class="ti ti-arrow-right"></i></span><div style="font-size:12px;color:var(--color-text-secondary);">geht an Server</div></div><div class="warning-box"><div class="warning-label">Wichtig</div><p>Kein seriöses System speichert das Passwort so ab. Was als nächstes passiert ist entscheidend.</p></div>'; }
  },
  {
    num: 2, color: '#854F0B', bg: '#FAEEDA',
    title: 'Hashing ohne Salt',
    sub: 'Einwegfunktion — aber unsicher',
    content: function() { return '<p>Die Hash-Funktion (z.B. SHA-256) wandelt das Passwort in eine fixe Zeichenkette um. Egal wie lang das Passwort: der Hash ist immer gleich lang. Der Prozess ist nicht umkehrbar.</p><div class="pipeline-row"><div class="pipe-box" style="background:#FAEEDA;color:#633806;border-color:#EF9F27;">Pizza123</div><span class="pipe-arrow"><i class="ti ti-arrow-right"></i></span><div class="pipe-box" style="background:var(--color-background-secondary);color:var(--color-text-secondary);border-color:var(--color-border-secondary);">SHA-256</div><span class="pipe-arrow"><i class="ti ti-arrow-right"></i></span><div class="pipe-box" style="background:var(--color-background-secondary);color:var(--color-text-primary);border-color:var(--color-border-secondary);font-size:11px;">5f4dcc3b5aa765d...</div></div><div class="warning-box"><div class="warning-label">Problem</div><p>Zwei User mit "Pizza123" haben denselben Hash. Angreifer können das ausnutzen.</p></div>'; }
  },
  {
    num: 3, color: '#A32D2D', bg: '#FCEBEB',
    title: 'Rainbow Table Angriff',
    sub: 'Warum unsalted Hashes gefährlich sind',
    content: function() { return '<p>Angreifer erstellen riesige Tabellen die Passwörter auf ihre Hashes mappen. Wenn sie eine gestohlene Datenbank bekommen, schlagen sie einfach nach.</p><table class="rt-table"><tr><th>Passwort</th><th>Hash (gekürzt)</th></tr><tr><td>123456</td><td>e10adc3949ba...</td></tr><tr class="highlight"><td>Pizza123</td><td>5f4dcc3b5aa7...</td></tr><tr><td>password</td><td>5baa61e4c9b9...</td></tr><tr><td>qwerty123</td><td>9f7b3e2d1a4c...</td></tr></table><p>Der Hash aus Schritt 2 (gelb markiert) würde sofort gefunden. Das Passwort ist in Sekunden entschlüsselt.</p>'; }
  },
  {
    num: 4, color: '#0F6E56', bg: '#E1F5EE',
    title: 'Salting — die Lösung',
    sub: 'Zufallswert macht jeden Hash einzigartig',
    content: function() { return '<p>Vor dem Hashing wird ein zufälliger Salt an das Passwort angehängt. Jeder User bekommt einen eigenen Salt, der zusammen mit dem Hash gespeichert wird.</p><div class="pipeline-row" style="flex-wrap:wrap;gap:6px;"><div class="pipe-box" style="background:#E1F5EE;color:#085041;border-color:#5DCAA5;">Pizza123</div><span style="color:var(--color-text-tertiary);font-size:13px;">+</span><div class="pipe-box" style="background:#EEEDFE;color:#3C3489;border-color:#AFA9EC;">x7k2m9</div><span style="color:var(--color-text-tertiary);font-size:11px;">(Salt)</span><span class="pipe-arrow"><i class="ti ti-arrow-right"></i></span><div class="pipe-box" style="background:var(--color-background-secondary);color:var(--color-text-secondary);border-color:var(--color-border-secondary);">SHA-256</div><span class="pipe-arrow"><i class="ti ti-arrow-right"></i></span><div class="pipe-box" style="background:var(--color-background-secondary);color:var(--color-text-primary);border-color:var(--color-border-secondary);font-size:11px;">a3f8b2c91d7e...</div></div><div class="good-box"><div class="good-label">Resultat</div><p>Zwei User mit "Pizza123" haben jetzt komplett verschiedene Hashes. Rainbow Tables werden nutzlos.</p></div>'; }
  },
  {
    num: 5, color: '#3C3489', bg: '#EEEDFE',
    title: 'Login-Vergleich',
    sub: 'Wie das System das Passwort prüft',
    content: function() { return '<p>Beim Login gibt der User sein Passwort ein. Das System holt den gespeicherten Salt, hängt ihn ans eingegebene Passwort, hasht das Resultat — und vergleicht es mit dem gespeicherten Hash.</p><div class="pipeline-row" style="flex-wrap:wrap;gap:6px;"><div class="pipe-box" style="background:#EEEDFE;color:#3C3489;border-color:#AFA9EC;">Pizza123</div><span style="color:var(--color-text-tertiary);font-size:13px;">+</span><div class="pipe-box" style="background:#EEEDFE;color:#3C3489;border-color:#AFA9EC;">x7k2m9</div><span class="pipe-arrow"><i class="ti ti-arrow-right"></i></span><div class="pipe-box" style="background:var(--color-background-secondary);color:var(--color-text-secondary);border-color:var(--color-border-secondary);">Hash</div><span class="pipe-arrow"><i class="ti ti-arrow-right"></i></span><div style="font-size:12px;display:flex;align-items:center;gap:5px;color:#0F6E56;"><i class="ti ti-circle-check" style="font-size:16px;"></i>Match!</div></div><div class="good-box"><div class="good-label">Merkhilfe</div><p>Das Original-Passwort verlässt nie die Datenbank — nur Hashes und Salts werden gespeichert. Selbst Admins sehen dein Passwort nie.</p></div>'; }
  }
];

var current = 0;

function render() {
  var s = STEPS[current];
  var html = '<div class="step-head"><div class="step-num" style="background:' + s.bg + ';color:' + s.color + ';">' + s.num + '</div><div><div class="step-title">' + s.title + '</div><div class="step-sub">' + s.sub + '</div></div></div><div class="step-body">' + s.content() + '</div>';
  document.getElementById('step-container').innerHTML = html;
  document.getElementById('step-counter').textContent = (current + 1) + ' / ' + STEPS.length;
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === STEPS.length - 1;
  if (current === STEPS.length - 1) {
    document.getElementById('btn-next').textContent = '';
    document.getElementById('btn-next').innerHTML = '<i class="ti ti-check" aria-hidden="true"></i> Fertig';
  } else {
    document.getElementById('btn-next').innerHTML = 'Weiter <i class="ti ti-arrow-right" aria-hidden="true"></i>';
  }
  document.querySelectorAll('.step-dot').forEach(function(d, i) {
    d.className = 'step-dot' + (i === current ? ' active' : i < current ? ' done' : '');
  });
}

function navigate(dir) {
  var next = current + dir;
  if (next >= 0 && next < STEPS.length) { current = next; render(); }
}

function goStep(i) { current = i; render(); }

render();
</script>
