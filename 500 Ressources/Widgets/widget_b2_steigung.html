<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steigung A — Interaktiv</title>
<style>
  :root {
    --v1: #7400b8;
    --v2: #6930c3;
    --v3: #5e60ce;
    --c1: #56cfe1;
    --c2: #80ffdb;
    --bg: #fafaf9;
    --bg-surface: #f3f0fa;
    --bg-card: #ffffff;
    --text: #1a1025;
    --text-muted: #4a3d6b;
    --text-dim: #9b94b8;
    --border: rgba(116, 0, 184, 0.10);
    --border-strong: rgba(116, 0, 184, 0.20);
    --font-body: 'DM Sans', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --radius: 6px;
    --radius-lg: 12px;
    --shadow-md: 0 1px 2px rgba(26,16,37,0.04), 0 10px 26px -16px rgba(116,0,184,0.30);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.75;
    padding: 1.5rem;
  }

  .widget {
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    box-shadow: var(--shadow-md);
    max-width: 560px;
    margin: 0 auto;
  }

  .widget-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--v2);
    margin-bottom: 1rem;
  }

  canvas {
    display: block;
    width: 100%;
    border-radius: var(--radius);
    background: var(--bg-surface);
    border: 1px solid var(--border);
  }

  .controls {
    margin-top: 1.25rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .control-label {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  input[type="range"] {
    flex: 1;
    accent-color: var(--v2);
    height: 4px;
    cursor: pointer;
  }

  .value-display {
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 600;
    color: var(--v2);
    min-width: 48px;
    text-align: right;
  }

  .info-row {
    margin-top: 1rem;
    padding: 0.75rem 1rem;
    background: var(--bg-surface);
    border-radius: var(--radius);
    border-left: 3px solid var(--v3);
    font-size: 13px;
    color: var(--text-muted);
    font-family: var(--font-mono);
  }

  .info-row span {
    color: var(--v2);
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="widget">
  <div class="widget-label">Widget — Steigung A</div>
  <canvas id="canvas" width="520" height="320"></canvas>

  <div class="controls">
    <span class="control-label">A =</span>
    <input type="range" id="slider" min="-3" max="3" step="0.1" value="1">
    <span class="value-display" id="aVal">1.0</span>
  </div>

  <div class="info-row">
    Formel: y = <span id="aFormula">1.0</span> × x &nbsp;|&nbsp;
    Bei x = 3: y = <span id="yAt3">3.0</span>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const slider = document.getElementById('slider');
  const aValEl = document.getElementById('aVal');
  const aFormulaEl = document.getElementById('aFormula');
  const yAt3El = document.getElementById('yAt3');

  const W = canvas.width;
  const H = canvas.height;
  const PAD = 40;

  // Koordinatensystem: x von -5 bis 5, y von -5 bis 5
  const RANGE = 5;

  function toCanvas(x, y) {
    const cx = PAD + (x + RANGE) / (2 * RANGE) * (W - 2 * PAD);
    const cy = H - PAD - (y + RANGE) / (2 * RANGE) * (H - 2 * PAD);
    return [cx, cy];
  }

  function draw(A) {
    ctx.clearRect(0, 0, W, H);

    // Hintergrund
    ctx.fillStyle = '#f3f0fa';
    ctx.fillRect(0, 0, W, H);

    // Grid
    ctx.strokeStyle = 'rgba(116,0,184,0.07)';
    ctx.lineWidth = 1;
    for (let i = -RANGE; i <= RANGE; i++) {
      const [x1, y1] = toCanvas(i, -RANGE);
      const [x2, y2] = toCanvas(i, RANGE);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      const [x3, y3] = toCanvas(-RANGE, i);
      const [x4, y4] = toCanvas(RANGE, i);
      ctx.beginPath(); ctx.moveTo(x3, y3); ctx.lineTo(x4, y4); ctx.stroke();
    }

    // Achsen
    ctx.strokeStyle = 'rgba(116,0,184,0.25)';
    ctx.lineWidth = 1.5;
    const [ax1, ay1] = toCanvas(-RANGE, 0);
    const [ax2, ay2] = toCanvas(RANGE, 0);
    ctx.beginPath(); ctx.moveTo(ax1, ay1); ctx.lineTo(ax2, ay2); ctx.stroke();
    const [bx1, by1] = toCanvas(0, -RANGE);
    const [bx2, by2] = toCanvas(0, RANGE);
    ctx.beginPath(); ctx.moveTo(bx1, by1); ctx.lineTo(bx2, by2); ctx.stroke();

    // Achsenbeschriftungen
    ctx.fillStyle = '#9b94b8';
    ctx.font = '12px JetBrains Mono, monospace';
    ctx.textAlign = 'center';
    for (let i = -RANGE; i <= RANGE; i++) {
      if (i === 0) continue;
      const [cx] = toCanvas(i, 0);
      ctx.fillText(i, cx, H - PAD + 16);
      const [, cy] = toCanvas(0, i);
      ctx.textAlign = 'right';
      ctx.fillText(i, PAD - 8, cy + 4);
      ctx.textAlign = 'center';
    }

    // Achsenlabels
    ctx.fillStyle = '#4a3d6b';
    ctx.font = '13px DM Sans, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('x (Breite)', W / 2, H - 6);
    ctx.save();
    ctx.translate(14, H / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('y (Länge)', 0, 0);
    ctx.restore();

    // Trennlinie y = A * x
    const x1 = -RANGE, y1 = A * x1;
    const x2 = RANGE, y2 = A * x2;
    const [cx1, cy1] = toCanvas(x1, y1);
    const [cx2, cy2] = toCanvas(x2, y2);

    // Gradient auf der Linie
    const grad = ctx.createLinearGradient(cx1, cy1, cx2, cy2);
    grad.addColorStop(0, '#7400b8');
    grad.addColorStop(0.5, '#5e60ce');
    grad.addColorStop(1, '#56cfe1');

    ctx.strokeStyle = grad;
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(cx1, cy1);
    ctx.lineTo(cx2, cy2);
    ctx.stroke();

    // Beispielpunkte: Marienkäfer (3, 1) und Raupe (1, 3)
    const points = [
      { x: 3, y: 1, label: 'Marienkäfer', color: '#6930c3', side: 'oben' },
      { x: 1, y: 3, label: 'Raupe', color: '#56cfe1', side: 'unten' },
    ];

    points.forEach(p => {
      const [px, py] = toCanvas(p.x, p.y);
      ctx.beginPath();
      ctx.arc(px, py, 7, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = p.color;
      ctx.font = '600 13px DM Sans, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(p.label, px + 12, py + 4);
    });

    // Formel-Label auf der Linie
    ctx.fillStyle = '#6930c3';
    ctx.font = '600 13px JetBrains Mono, monospace';
    ctx.textAlign = 'left';
    const midX = W / 2 + 10;
    const [, midY] = toCanvas(0, 0);
    ctx.fillText(`y = ${A.toFixed(1)}x`, midX, midY - 12);
  }

  slider.addEventListener('input', () => {
    const A = parseFloat(slider.value);
    aValEl.textContent = A.toFixed(1);
    aFormulaEl.textContent = A.toFixed(1);
    yAt3El.textContent = (A * 3).toFixed(1);
    draw(A);
  });

  draw(1.0);
</script>
</body>
</html>
