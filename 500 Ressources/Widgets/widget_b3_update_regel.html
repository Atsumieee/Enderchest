<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update-Regel — Interaktiv</title>
<style>
  :root {
    --v1: #7400b8; --v2: #6930c3; --v3: #5e60ce; --c1: #56cfe1;
    --bg: #fafaf9; --bg-surface: #f3f0fa; --bg-card: #ffffff;
    --text: #1a1025; --text-muted: #4a3d6b; --text-dim: #9b94b8;
    --border: rgba(116,0,184,0.10); --border-strong: rgba(116,0,184,0.20);
    --grid: rgba(116,0,184,0.07); --axis: rgba(116,0,184,0.25);
    --canvas-bg: #f3f0fa;
    --zone-raupe: rgba(54,163,90,0.10); --zone-kaefer: rgba(220,38,38,0.07);
    --status-success: #36a35a; --status-danger: #dc2626;
    --shadow-md: 0 1px 2px rgba(26,16,37,0.04), 0 10px 26px -16px rgba(116,0,184,0.30);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --v2: #a78bfa; --v3: #5e60ce;
      --bg: #0d0b14; --bg-surface: #13101e; --bg-card: #1a1628;
      --text: #ede9ff; --text-muted: #9b94b8; --text-dim: #4a4460;
      --border: rgba(116,0,184,0.20); --border-strong: rgba(94,96,206,0.35);
      --grid: rgba(94,96,206,0.10); --axis: rgba(94,96,206,0.35);
      --canvas-bg: #100d1a;
      --zone-raupe: rgba(54,163,90,0.13); --zone-kaefer: rgba(220,38,38,0.10);
    }
  }
  [data-theme="dark"] {
    --v2: #a78bfa; --v3: #5e60ce;
    --bg: #0d0b14; --bg-surface: #13101e; --bg-card: #1a1628;
    --text: #ede9ff; --text-muted: #9b94b8; --text-dim: #4a4460;
    --border: rgba(116,0,184,0.20); --border-strong: rgba(94,96,206,0.35);
    --grid: rgba(94,96,206,0.10); --axis: rgba(94,96,206,0.35);
    --canvas-bg: #100d1a;
    --zone-raupe: rgba(54,163,90,0.13); --zone-kaefer: rgba(220,38,38,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 15px; line-height: 1.75; padding: 1.5rem;
    transition: background 0.15s, color 0.15s;
  }
  .widget {
    background: var(--bg-card); border: 1px solid var(--border-strong);
    border-radius: 12px; padding: 1.5rem; box-shadow: var(--shadow-md);
    max-width: 560px; margin: 0 auto;
  }
  .widget-label {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--v2); margin-bottom: 1rem;
  }
  canvas { display: block; width: 100%; border-radius: 6px; border: 1px solid var(--border); }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem; margin-top: 1rem; }
  .stat-box {
    background: var(--bg-surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.75rem; text-align: center;
  }
  .stat-label {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-dim); display: block; margin-bottom: 0.25rem;
  }
  .stat-value {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 17px; font-weight: 600; color: var(--v2);
  }
  .stat-value.pos { color: var(--status-success); }
  .stat-value.neg { color: var(--status-danger); }
  .btn-row { display: flex; gap: 0.75rem; margin-top: 1rem; }
  button {
    flex: 1; padding: 0.6rem 1rem; border-radius: 6px; border: none;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 13px; font-weight: 600; cursor: pointer;
    letter-spacing: 0.04em; transition: opacity 0.12s;
  }
  button:hover { opacity: 0.85; }
  #btnStep { background: linear-gradient(90deg, var(--v1), var(--v3)); color: #fff; }
  #btnReset { background: var(--bg-surface); color: var(--text-muted); border: 1px solid var(--border-strong); }
  .formula-row {
    margin-top: 0.75rem; padding: 0.6rem 1rem; background: var(--bg-surface);
    border-left: 3px solid var(--v3); border-radius: 6px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px; color: var(--text-muted); line-height: 1.9;
  }
  .formula-row span { color: var(--v2); font-weight: 600; }
  .status-row {
    margin-top: 0.75rem; font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px; color: var(--text-dim); text-align: center; min-height: 1.4em;
  }
  .control-row { margin-top: 1rem; display: flex; align-items: center; gap: 1rem; }
  .control-row label {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 13px; color: var(--text-muted); white-space: nowrap;
  }
  input[type="range"] { flex: 1; accent-color: var(--v2); height: 4px; cursor: pointer; }
  .lr-val {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 14px; font-weight: 600; color: var(--v2);
    min-width: 36px; text-align: right;
  }
</style>
</head>
<body>
<div class="widget">
  <div class="widget-label" id="wLabel">Widget — Schritt 1: Marienkäfer prüfen</div>
  <canvas id="canvas" width="520" height="380"></canvas>

  <div class="control-row">
    <label>Lernrate =</label>
    <input type="range" id="lrSlider" min="0.1" max="1" step="0.1" value="0.5">
    <span class="lr-val" id="lrVal">0.5</span>
  </div>

  <div class="stats">
    <div class="stat-box">
      <span class="stat-label">Steigung A</span>
      <span class="stat-value" id="statA">1.600</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Lücke</span>
      <span class="stat-value" id="statGap">—</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Geprüft</span>
      <span class="stat-value" id="statWho" style="font-size:13px;">—</span>
    </div>
  </div>

  <div class="formula-row">
    neue Steigung = <span id="fOld">1.600</span> + <span id="fLr">0.5</span> &times; (<span id="fGap">?</span> / <span id="fX">?</span>) = <span id="fNew">?</span>
  </div>

  <div class="btn-row">
    <button id="btnStep">Nächsten Punkt prüfen</button>
    <button id="btnReset">Zurücksetzen</button>
  </div>

  <div class="status-row" id="statusRow">Start: Linie zu steil (A = 1.6). Klicke "Nächsten Punkt prüfen".</div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height, PAD = 46;
  const X_MIN = 0, X_MAX = 4, Y_MIN = 0, Y_MAX = 4;

  // Punkte wie im Colab
  const KAEFER = { x: 3, y: 1.1, name: 'Marienkäfer', color: '#dc2626' };
  const RAUPE  = { x: 1, y: 3.0, name: 'Raupe',       color: '#36a35a' };
  const SEQUENCE = [KAEFER, RAUPE]; // abwechselnd
  const START_A = 1.60;

  let A = START_A;
  let learningRate = 0.5;
  let step = 0;
  let prevA = null;

  function getCSSVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function toCanvas(x, y) {
    const cx = PAD + (x - X_MIN) / (X_MAX - X_MIN) * (W - 2 * PAD);
    const cy = H - PAD - (y - Y_MIN) / (Y_MAX - Y_MIN) * (H - 2 * PAD);
    return [cx, cy];
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const canvasBg = getCSSVar('--canvas-bg') || '#f3f0fa';
    const gridColor = getCSSVar('--grid') || 'rgba(116,0,184,0.07)';
    const axisColor = getCSSVar('--axis') || 'rgba(116,0,184,0.25)';
    const dimColor = getCSSVar('--text-dim') || '#9b94b8';
    const mutedColor = getCSSVar('--text-muted') || '#4a3d6b';
    const accentColor = getCSSVar('--v2') || '#6930c3';
    const zoneRaupe = getCSSVar('--zone-raupe') || 'rgba(54,163,90,0.10)';
    const zoneKaefer = getCSSVar('--zone-kaefer') || 'rgba(220,38,38,0.07)';

    ctx.fillStyle = canvasBg;
    ctx.fillRect(0, 0, W, H);

    // Plot-Bereich Eckpunkte
    const [plx0, ply0] = toCanvas(X_MIN, Y_MIN);
    const [plx1, ply1] = toCanvas(X_MAX, Y_MAX);

    // Farbflächen: oberhalb der Linie = Raupe (grün), unterhalb = Marienkäfer (orange/rot)
    // Linie y = A*x, geclipt am Plot-Rand
    let ix2 = X_MAX, iy2 = A * X_MAX;
    if (iy2 > Y_MAX) { iy2 = Y_MAX; ix2 = Y_MAX / A; }
    const [c0x, c0y] = toCanvas(X_MIN, Y_MIN);
    const [clx, cly] = toCanvas(ix2, iy2);

    // Unterhalb (Marienkäfer): Polygon Ursprung -> entlang x-Achse -> rechte untere Ecke -> Linienende
    ctx.fillStyle = zoneKaefer;
    ctx.beginPath();
    const [b0x, b0y] = toCanvas(X_MIN, Y_MIN);
    const [b1x, b1y] = toCanvas(X_MAX, Y_MIN);
    const [b2x, b2y] = toCanvas(X_MAX, Math.min(A * X_MAX, Y_MAX));
    ctx.moveTo(b0x, b0y); ctx.lineTo(b1x, b1y);
    if (A * X_MAX <= Y_MAX) {
      ctx.lineTo(b2x, b2y);
    } else {
      const [e1x, e1y] = toCanvas(X_MAX, Y_MAX);
      const [e2x, e2y] = toCanvas(Y_MAX / A, Y_MAX);
      ctx.lineTo(e1x, e1y); ctx.lineTo(e2x, e2y);
    }
    ctx.closePath(); ctx.fill();

    // Oberhalb (Raupe): restliches Rechteck
    ctx.fillStyle = zoneRaupe;
    ctx.beginPath();
    const [t0x, t0y] = toCanvas(X_MIN, Y_MIN);
    const [t1x, t1y] = toCanvas(X_MIN, Y_MAX);
    const [t2x, t2y] = toCanvas(X_MAX, Y_MAX);
    ctx.moveTo(t0x, t0y); ctx.lineTo(t1x, t1y); ctx.lineTo(t2x, t2y);
    if (A * X_MAX <= Y_MAX) {
      const [t3x, t3y] = toCanvas(X_MAX, A * X_MAX);
      ctx.lineTo(t3x, t3y);
    } else {
      const [t3x, t3y] = toCanvas(Y_MAX / A, Y_MAX);
      ctx.lineTo(t3x, t3y);
    }
    ctx.closePath(); ctx.fill();

    // Grid
    ctx.strokeStyle = gridColor; ctx.lineWidth = 1;
    for (let i = X_MIN; i <= X_MAX; i++) {
      const [x1, y1] = toCanvas(i, Y_MIN);
      const [x2, y2] = toCanvas(i, Y_MAX);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    for (let i = Y_MIN; i <= Y_MAX; i++) {
      const [x3, y3] = toCanvas(X_MIN, i);
      const [x4, y4] = toCanvas(X_MAX, i);
      ctx.beginPath(); ctx.moveTo(x3, y3); ctx.lineTo(x4, y4); ctx.stroke();
    }

    // Achsen
    ctx.strokeStyle = axisColor; ctx.lineWidth = 1.5;
    let [ax1, ay1] = toCanvas(X_MIN, Y_MIN);
    let [ax2, ay2] = toCanvas(X_MAX, Y_MIN);
    ctx.beginPath(); ctx.moveTo(ax1, ay1); ctx.lineTo(ax2, ay2); ctx.stroke();
    let [bx1c, by1c] = toCanvas(X_MIN, Y_MIN);
    let [bx2c, by2c] = toCanvas(X_MIN, Y_MAX);
    ctx.beginPath(); ctx.moveTo(bx1c, by1c); ctx.lineTo(bx2c, by2c); ctx.stroke();

    // Achsenbeschriftung
    ctx.fillStyle = dimColor; ctx.font = '11px JetBrains Mono, monospace';
    ctx.textAlign = 'center';
    for (let i = X_MIN; i <= X_MAX; i++) {
      const [cx] = toCanvas(i, Y_MIN);
      ctx.fillText(i, cx, H - PAD + 18);
    }
    for (let i = Y_MIN + 1; i <= Y_MAX; i++) {
      const [, cy] = toCanvas(X_MIN, i);
      ctx.textAlign = 'right';
      ctx.fillText(i, PAD - 8, cy + 4);
    }

    ctx.fillStyle = mutedColor; ctx.font = '12px DM Sans, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('x (Breite)', W / 2, H - 4);
    ctx.save(); ctx.translate(13, H / 2); ctx.rotate(-Math.PI / 2);
    ctx.fillText('y (Länge)', 0, 0); ctx.restore();

    // Zonen-Labels
    ctx.font = '11px DM Sans, sans-serif'; ctx.textAlign = 'left';
    ctx.fillStyle = '#36a35a';
    ctx.fillText('oberhalb: Raupe', toCanvas(0.15, 3.8)[0], toCanvas(0.15, 3.8)[1]);

    // alte Linie (grau gestrichelt) wenn vorhanden
    if (prevA !== null) {
      ctx.strokeStyle = dimColor; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
      let px2 = X_MAX, py2 = prevA * X_MAX;
      if (py2 > Y_MAX) { py2 = Y_MAX; px2 = Y_MAX / prevA; }
      const [pcx1, pcy1] = toCanvas(X_MIN, 0);
      const [pcx2, pcy2] = toCanvas(px2, py2);
      ctx.beginPath(); ctx.moveTo(pcx1, pcy1); ctx.lineTo(pcx2, pcy2); ctx.stroke();
      ctx.setLineDash([]);
    }

    // aktuelle Linie (Gradient)
    let lx2 = X_MAX, ly2 = A * X_MAX;
    if (ly2 > Y_MAX) { ly2 = Y_MAX; lx2 = Y_MAX / A; }
    const [lcx1, lcy1] = toCanvas(X_MIN, 0);
    const [lcx2, lcy2] = toCanvas(lx2, ly2);
    const grad = ctx.createLinearGradient(lcx1, lcy1, lcx2, lcy2);
    grad.addColorStop(0, '#7400b8'); grad.addColorStop(1, '#56cfe1');
    ctx.strokeStyle = grad; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(lcx1, lcy1); ctx.lineTo(lcx2, lcy2); ctx.stroke();

    // Formel-Labels obere rechte Ecke
    ctx.textAlign = 'right'; ctx.font = '600 12px JetBrains Mono, monospace';
    if (prevA !== null) {
      ctx.fillStyle = dimColor;
      ctx.fillText('alt: y = ' + prevA.toFixed(3) + 'x', W - PAD - 8, PAD + 16);
      ctx.fillStyle = accentColor;
      ctx.fillText('neu: y = ' + A.toFixed(3) + 'x', W - PAD - 8, PAD + 32);
    } else {
      ctx.fillStyle = accentColor;
      ctx.fillText('y = ' + A.toFixed(3) + 'x', W - PAD - 8, PAD + 16);
    }

    // beide Punkte zeichnen
    [KAEFER, RAUPE].forEach(p => {
      const [px, py] = toCanvas(p.x, p.y);
      ctx.beginPath(); ctx.arc(px, py, 8, 0, Math.PI * 2);
      ctx.fillStyle = p.color; ctx.fill();
      ctx.strokeStyle = canvasBg; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = p.color; ctx.font = '600 12px DM Sans, sans-serif';
      ctx.textAlign = 'left';
      const lblOffset = p.name === 'Marienkäfer' ? 13 : 13;
      ctx.fillText(p.name, px + lblOffset, py + 4);
    });

    // Lücke des aktuell geprüften Punktes
    if (step > 0) {
      const checked = SEQUENCE[(step - 1) % 2];
      const [px, py] = toCanvas(checked.x, checked.y);
      const yLine = A * checked.x; // nach Update; nur zur Visualisierung der Restlücke
    }
  }

  document.getElementById('btnStep').addEventListener('click', () => {
    const p = SEQUENCE[step % 2];
    const lineY = A * p.x;
    const gap = p.y - lineY;          // Lücke = gewünschte Höhe - Linie
    const corr = learningRate * (gap / p.x);
    prevA = A;
    A = A + corr;
    step++;

    document.getElementById('statA').textContent = A.toFixed(3);
    const gapEl = document.getElementById('statGap');
    gapEl.textContent = gap.toFixed(2);
    gapEl.className = 'stat-value ' + (gap >= 0 ? 'pos' : 'neg');
    document.getElementById('statWho').textContent = p.name;

    document.getElementById('fOld').textContent = prevA.toFixed(3);
    document.getElementById('fLr').textContent = learningRate.toFixed(1);
    document.getElementById('fGap').textContent = gap.toFixed(2);
    document.getElementById('fX').textContent = p.x;
    document.getElementById('fNew').textContent = A.toFixed(3);

    const nextP = SEQUENCE[step % 2];
    document.getElementById('wLabel').textContent =
      'Widget — Schritt ' + (step + 1) + ': ' + nextP.name + ' prüfen';

    let richtung = gap < 0 ? 'Linie war zu hoch, wird flacher' : 'Linie war zu tief, wird steiler';
    document.getElementById('statusRow').textContent =
      'Schritt ' + step + ' (' + p.name + '): ' + richtung + ' — A: ' + prevA.toFixed(3) + ' -> ' + A.toFixed(3);

    draw();
  });

  document.getElementById('btnReset').addEventListener('click', () => {
    A = START_A; step = 0; prevA = null;
    document.getElementById('statA').textContent = START_A.toFixed(3);
    document.getElementById('statGap').textContent = '—';
    document.getElementById('statGap').className = 'stat-value';
    document.getElementById('statWho').textContent = '—';
    document.getElementById('fOld').textContent = START_A.toFixed(3);
    document.getElementById('fGap').textContent = '?';
    document.getElementById('fX').textContent = '?';
    document.getElementById('fNew').textContent = '?';
    document.getElementById('wLabel').textContent = 'Widget — Schritt 1: Marienkäfer prüfen';
    document.getElementById('statusRow').textContent = 'Start: Linie zu steil (A = 1.6). Klicke "Nächsten Punkt prüfen".';
    draw();
  });

  document.getElementById('lrSlider').addEventListener('input', (e) => {
    learningRate = parseFloat(e.target.value);
    document.getElementById('lrVal').textContent = learningRate.toFixed(1);
    document.getElementById('fLr').textContent = learningRate.toFixed(1);
  });

  const observer = new MutationObserver(() => draw());
  observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class'] });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => draw());

  draw();
</script>
</body>
</html>
